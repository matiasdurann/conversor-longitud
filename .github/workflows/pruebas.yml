name: Pruebas del conversor

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pruebas:
    name: Python 3.13 - Windows
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Instalar dependencias de la aplicación
        run: python -m pip install -r requirements.txt
      - name: Pruebas de lógica y mejora
        run: python -m unittest discover -s tests -v
      - name: Regresión de controles y conversiones
        run: python -m unittest -v test_conversor.py
